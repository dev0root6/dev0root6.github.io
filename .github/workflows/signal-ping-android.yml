# Builds the Signal Ping APK and attaches it to the run as a downloadable
# artifact. This is the easiest way to get an installable file without setting
# up Android Studio locally: push, then Actions -> this run -> Artifacts.
#
# Configure once in the repository settings:
#   Variables: SIGNAL_PING_HOST  = signal-ping.<your-subdomain>.workers.dev
#   Secrets (optional, for a stable release signature):
#     SIGNAL_PING_KEYSTORE_BASE64   = base64 of your .keystore file
#     SIGNAL_PING_KEYSTORE_PASSWORD
#     SIGNAL_PING_KEY_ALIAS
#     SIGNAL_PING_KEY_PASSWORD
# Without the secrets the workflow still produces a debug-signed APK, which
# installs fine by sideloading.

name: Signal Ping Android

on:
  push:
    branches: ['**']
    paths:
      - 'signal-ping/android/**'
      - '.github/workflows/signal-ping-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-ping/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNAL_PING_KEYSTORE_BASE64 }}
        # The `secrets` context is not available in a step-level `if`, so the
        # "was a keystore configured?" test happens here instead.
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signal-ping.keystore"
            echo "path=$RUNNER_TEMP/signal-ping.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          # Falls back to the placeholder in gradle.properties if the variable
          # is unset, which builds but points at a host that does not exist.
          SIGNAL_PING_HOST: ${{ vars.SIGNAL_PING_HOST }}
          SIGNAL_PING_KEYSTORE: ${{ steps.keystore.outputs.path }}
          SIGNAL_PING_KEYSTORE_PASSWORD: ${{ secrets.SIGNAL_PING_KEYSTORE_PASSWORD }}
          SIGNAL_PING_KEY_ALIAS: ${{ secrets.SIGNAL_PING_KEY_ALIAS }}
          SIGNAL_PING_KEY_PASSWORD: ${{ secrets.SIGNAL_PING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          HOST_ARG=""
          if [ -n "$SIGNAL_PING_HOST" ]; then HOST_ARG="-PsignalPingHost=$SIGNAL_PING_HOST"; fi
          if [ -n "$SIGNAL_PING_KEYSTORE" ]; then
            ./gradlew --no-daemon assembleRelease $HOST_ARG
          else
            echo "No release keystore configured — building a debug-signed APK."
            ./gradlew --no-daemon assembleDebug $HOST_ARG
          fi

      - name: Report the signing fingerprint
        # This is the value that goes in wrangler.toml as
        # ANDROID_CERT_FINGERPRINTS, so the site verifies the app.
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "Built: $APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -i 'SHA-256 digest' || true

      - uses: actions/upload-artifact@v4
        with:
          name: signal-ping-apk
          path: signal-ping/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
