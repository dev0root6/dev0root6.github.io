org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# The one setting you must change: the HTTPS origin serving the Signal Ping PWA
# (your deployed Worker). The APK is a shell around this URL, so it has to be
# right at build time — and it must match the domain hosting assetlinks.json.
#
# Override without editing this file:
#   ./gradlew assembleRelease -PsignalPingHost=signal-ping.you.workers.dev
# ---------------------------------------------------------------------------
signalPingHost=signal-ping.example.workers.dev
